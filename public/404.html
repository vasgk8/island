<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lost at sea · VASGK ISLAND</title>
	<meta name="robots" content="noindex" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
	<style>
		/* Served by GitHub Pages and Netlify for any path that does not exist. Self-contained: the same
		   dusk-sea colours and wordmark as the loading screen, an island on the horizon, a way home. */
		:root {
			--ink: #eef4f7;
			--ink-2: rgba(238, 244, 247, 0.72);
			--sun: #ffd7a8;
			--aqua: #4fd1c5;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			min-height: 100%;
			height: 100%;
		}

		body {
			display: grid;
			place-items: center;
			padding: 24px 16px;
			color: var(--ink);
			font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
			-webkit-font-smoothing: antialiased;
			background:
				radial-gradient(120% 60% at 50% 100%, rgba(255, 170, 110, 0.16) 0%, transparent 60%),
				radial-gradient(80% 50% at 50% 55%, rgba(60, 150, 170, 0.14) 0%, transparent 70%),
				linear-gradient(180deg, #04070c 0%, #071421 55%, #0b2232 100%);
			background-attachment: fixed;
		}

		main {
			width: min(100%, 720px);
			display: grid;
			justify-items: center;
			gap: 22px;
			text-align: center;
			container-type: inline-size;
		}

		.brand {
			margin: 0 -0.3em 0 0;
			font-size: min(56px, 8cqi);
			font-weight: 600;
			letter-spacing: 0.3em;
			white-space: nowrap;
			color: transparent;
			background: linear-gradient(180deg, #ffffff 20%, #fff0dc 70%, var(--sun) 100%);
			-webkit-background-clip: text;
			background-clip: text;
		}

		svg.scene {
			width: min(100%, 520px);
			height: auto;
			overflow: visible;
			/* the sea and the horizon fade out to the sides instead of ending in a box */
			-webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
			mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
		}

		a.home svg {
			width: 18px;
			height: 18px;
			flex: none;
		}

		.code {
			margin: 0;
			font-size: 15px;
			font-weight: 600;
			letter-spacing: 0.32em;
			color: var(--sun);
		}

		h1 {
			margin: -10px 0 0;
			font-size: clamp(26px, 5vw, 36px);
			font-weight: 600;
			letter-spacing: -0.01em;
		}

		p.lead {
			margin: -8px 0 0;
			max-width: 32em;
			font-size: 16px;
			line-height: 1.55;
			color: var(--ink-2);
		}

		a.home {
			display: inline-flex;
			white-space: nowrap;
			align-items: center;
			gap: 10px;
			min-height: 46px;
			padding: 0 22px;
			border-radius: 999px;
			font-size: 15px;
			font-weight: 600;
			color: #06222a;
			background: var(--aqua);
			text-decoration: none;
			box-shadow: 0 6px 24px rgba(79, 209, 197, 0.25);
			transition: transform 0.15s ease, box-shadow 0.15s ease;
		}

		a.home:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 28px rgba(79, 209, 197, 0.35);
		}

		a.home:focus-visible {
			outline: 2px solid #fff;
			outline-offset: 3px;
		}

		.swell {
			animation: swell 5s ease-in-out infinite;
		}

		.swell.b {
			animation-duration: 7s;
			animation-direction: reverse;
		}

		.bottle {
			transform-box: fill-box;
			transform-origin: center;
			animation: bob 3.6s ease-in-out infinite;
		}

		@keyframes swell {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(-24px); }
		}

		@keyframes bob {
			0%, 100% { transform: translateY(0) rotate(-14deg); }
			50% { transform: translateY(-5px) rotate(-6deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			.swell, .bottle { animation: none; }
		}
	</style>
</head>
<body>
	<main>
		<div class="brand" aria-label="VASGK ISLAND">VASGK ISLAND</div>

		<!-- the island on the horizon at dusk, a message in a bottle drifting in front of it -->
		<svg class="scene" viewBox="0 0 520 210" role="img" aria-label="An island on the horizon, a bottle drifting in the sea">
			<defs>
				<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#1b5f6e" />
					<stop offset="1" stop-color="#0a2433" />
				</linearGradient>
				<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
					<stop offset="0" stop-color="#ffe3bd" />
					<stop offset="0.55" stop-color="#ffb980" stop-opacity="0.85" />
					<stop offset="1" stop-color="#ff9a6a" stop-opacity="0" />
				</radialGradient>
			</defs>
			<circle cx="360" cy="112" r="58" fill="url(#sun)" />
			<!-- island: mountain, long beaches, a palm -->
			<path d="M60 120 C120 118 150 110 175 96 C200 80 220 52 248 50 C272 48 286 70 300 84 C318 102 350 116 440 120 Z" fill="#12261c" />
			<path d="M40 121 C120 116 360 116 470 121 L470 124 L40 124 Z" fill="#e8d3a2" opacity="0.85" />
			<g fill="#0f2017">
				<path d="M398 120 C397 104 400 92 406 84 L408 85 C403 93 401 104 402 120 Z" />
				<path d="M407 84 C397 78 387 80 380 86 C389 82 398 82 406 86 Z" />
				<path d="M407 84 C416 76 427 77 434 82 C425 80 416 81 408 86 Z" />
				<path d="M407 84 C404 74 397 69 390 68 C397 72 402 78 405 86 Z" />
				<path d="M407 84 C413 75 421 72 428 72 C420 75 413 80 409 86 Z" />
			</g>
			<!-- sea -->
			<rect x="0" y="122" width="520" height="88" fill="url(#sea)" />
			<path class="swell" d="M-30 140 Q 0 134 30 140 T 90 140 T 150 140 T 210 140 T 270 140 T 330 140 T 390 140 T 450 140 T 510 140 T 570 140" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
			<path class="swell b" d="M-30 168 Q 0 161 30 168 T 90 168 T 150 168 T 210 168 T 270 168 T 330 168 T 390 168 T 450 168 T 510 168 T 570 168" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
			<path d="M330 124 L392 124 L376 136 L346 136 Z" fill="#ffd7a8" opacity="0.18" />
			<!-- the bottle -->
			<g class="bottle">
				<rect x="150" y="150" width="34" height="14" rx="6" fill="#7fc8b8" opacity="0.9" />
				<rect x="182" y="153" width="10" height="8" rx="2" fill="#7fc8b8" opacity="0.9" />
				<rect x="191" y="154" width="5" height="6" rx="1" fill="#b98a5a" />
				<rect x="156" y="153" width="20" height="8" rx="2" fill="#f4ead2" opacity="0.9" />
			</g>
		</svg>

		<p class="code">404</p>
		<h1>This page drifted out to sea</h1>
		<p class="lead">There's nothing at this address. The island is still where you left it.</p>
		<a class="home" id="home" href="/">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /></svg>
			Back to the island
		</a>
	</main>
	<script>
		// GitHub Pages serves the project under /<repo>/ (and this page for any missing path below it);
		// Netlify and local previews serve it at the site root.
		( function () {

			var seg = location.pathname.split( '/' ).filter( Boolean );
			var home = /\.github\.io$/.test( location.hostname ) && seg.length > 1 ? '/' + seg[ 0 ] + '/' : '/';
			document.getElementById( 'home' ).href = home;

		} )();
	</script>
</body>
</html>
